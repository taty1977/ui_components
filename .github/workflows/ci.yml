name: CI

# Quality gates on every push to master and every PR.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-tokens
      - run: npm run typecheck
      - run: npm run lint
      # Storybook tests run in headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build-storybook
      - run: npm run check-package
